apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotmess-enterprise
  labels:
    app: hotmess
    tier: frontend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hotmess
  template:
    metadata:
      labels:
        app: hotmess
        tier: frontend
    spec:
      containers:
      - name: hotmess
        image: hotmess-enterprise:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5173
          name: http
          protocol: TCP
        envFrom:
        - secretRef:
            name: hotmess-secrets
        - configMapRef:
            name: hotmess-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: hotmess-service
  labels:
    app: hotmess
spec:
  type: LoadBalancer
  selector:
    app: hotmess
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5173
    name: http
  sessionAffinity: ClientIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hotmess-config
data:
  NODE_ENV: "production"
  RADIOKING_BASE: "https://api.radioking.io"
  RADIOKING_SLUG: "hotmess-radio"
  WEATHER_API_BASE: "https://api.open-meteo.com"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hotmess-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hotmess-enterprise
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
